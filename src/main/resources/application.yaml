spring:
  application:
    name: stockflow

  datasource:
    url: jdbc:postgresql://localhost:5433/stockflow
    username: postgres
    password: postgres

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080





